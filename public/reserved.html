<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow,noarchive">
 <meta name="theme-color" content="#FFFFFF">
 <title>RESERVED — NOVA</title>
 <link rel="stylesheet" href="/reserved.css">
 <script type="module" src="/reserved.js"></script>
</head>
<body>
 <main class="reserved-shell">
  <header class="reserved-header">
   <div class="reserved-brand"><span>NOVA</span><span class="reserved-slash">/</span><span>RESERVED</span></div>
   <div id="staff-actions" class="reserved-staff" hidden>
    <a href="/" target="_blank" rel="noopener noreferrer">На сайт</a>
    <button id="logout" type="button">Выйти</button>
   </div>
  </header>
  <section id="login-panel" class="login-panel">
   <p class="overline">СЛУЖЕБНЫЙ ДОСТУП</p>
   <h1>Бронирования.</h1>
   <p class="login-help">Заявки гостей NOVA, HÓF, Победителей и Востока. Доступ только для сотрудников.</p>
   <form id="login-form">
    <label for="password">Пароль доступа</label>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
    <button type="submit" class="primary-button">Войти</button>
    <p id="login-status" class="status" role="status"></p>
   </form>
  </section>
  <section id="dashboard" class="dashboard" hidden>
   <div class="dashboard-title">
    <div><p class="overline">NOVA / МИНСК</p><h1>Бронирования.</h1><p class="lead">Новые заявки требуют подтверждения администратором. Уведомления в Telegram пока не подключены.</p></div>
    <div class="dashboard-meta"><span id="total-count" class="big-number">—</span><span>заявок по фильтру</span></div>
   </div>
   <div class="dashboard-toolbar" role="group" aria-label="Фильтры заявок">
    <label>Заведение<select id="filter-venue">
      <option value="all">Все заведения</option><option value="zyb">HÓF / Зыбицкая</option>
      <option value="pob">Победителей</option><option value="east">Восток</option>
    </select></label>
    <label>Статус<select id="filter-status">
      <option value="all">Все статусы</option><option value="new">Новая</option>
      <option value="confirmed">Подтверждена</option><option value="cancelled">Отменена</option>
      <option value="completed">Завершена</option><option value="no_show">Не пришли</option>
    </select></label>
    <label>Дата<input type="date" id="filter-date"></label>
    <button class="ghost-button" id="reset-filters" type="button">Сбросить</button>
    <button class="primary-button refresh" id="refresh" type="button">Обновить</button>
   </div>
   <p id="dashboard-status" class="status" role="status" aria-live="polite"></p>
   <div id="reservations" class="reservation-list" aria-live="polite"></div>
   <div class="pagination"><button id="previous" class="ghost-button" type="button" disabled>Назад</button><span id="page-number">1</span><button id="next" class="ghost-button" type="button" disabled>Далее</button></div>
  </section>
 </main>
</body>
</html>
