name: One-time NOVA branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    # This job runs only for the explicitly named cleanup merge commit.
    if: startsWith(github.event.head_commit.message, 'Run one-time NOVA branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Keep main and a verified backup; delete remaining branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_BRANCH: backup/nova-release-20261108
          EXPECTED_BACKUP_SHA: 9befbfb9f1f34657847f5055f5442fbdb2ab8de0
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          backup_sha="$(gh api "repos/${repo}/git/ref/heads/${BACKUP_BRANCH}" --jq '.object.sha')"
          if [[ "${backup_sha}" != "${EXPECTED_BACKUP_SHA}" ]]; then
            echo "::error::Backup branch missing or unexpected SHA. No branches were deleted."
            exit 1
          fi

          open_prs="$(gh api "repos/${repo}/pulls?state=open&per_page=100" --jq 'length')"
          if [[ "${open_prs}" != 0 ]]; then
            echo "::error::There are open pull requests. No branches were deleted."
            exit 1
          fi

          mapfile -t names < <(gh api --paginate "repos/${repo}/branches?per_page=100" --jq '.[].name')
          if (( ${#names[@]} < 3 )); then
            echo "::notice::Only main and the backup remain."
            exit 0
          fi

          deleted=0
          failed=0
          for branch in "${names[@]}"; do
            if [[ "${branch}" == main || "${branch}" == "${BACKUP_BRANCH}" ]]; then
              echo "KEEP: ${branch}"
              continue
            fi
            if gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}" >/dev/null 2>&1; then
              echo "DELETED: ${branch}"
              ((deleted+=1))
            else
              echo "::warning::FAILED: ${branch}"
              ((failed+=1))
            fi
          done
          echo "Deleted: ${deleted}; failed: ${failed}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Preserved: main and ${BACKUP_BRANCH}" >> "${GITHUB_STEP_SUMMARY}"
          if (( failed > 0 )); then
            echo "::error::Some branches could not be deleted; see job output."
            exit 1
          fi
