name: NOVA website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          NOVA_TEST_ARTIFACTS: artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-browser
          path: artifacts/browser
      - name: One-time public read-only release audit
        if: always() && github.head_ref == 'codex/post-deploy-audit-81'
        continue-on-error: true
        run: node scripts/smoke-public.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'codex/post-deploy-audit-81'
        with:
          name: nova-public-audit
          path: artifacts/public-smoke
