name: NOVA website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          NOVA_TEST_ARTIFACTS: artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-browser
          path: artifacts/browser
      - name: One-time release verification for Issue 83
        if: github.head_ref == 'codex/staging-acceptance-83'
        run: node scripts/smoke-public.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'codex/staging-acceptance-83'
        with:
          name: nova-production-83
          path: artifacts/public-smoke
      - name: Check staging admission without credentials
        if: github.head_ref == 'codex/staging-acceptance-83'
        run: |
          set -eu
          for origin in https://511781d7-nova-lounge-demo.blacklivi-olx.workers.dev https://codex-nova-private-stage-83-nova-lounge-demo.blacklivi-olx.workers.dev; do
            for path in / /app.js /site.css /admin /reserved /api/content /api/reserved/session /api/reservations; do
              status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$origin$path")
              printf '%s %s %s\n' "$(date -u +%FT%TZ)" "$origin$path" "$status"
              test "$status" = 401
            done
          done
